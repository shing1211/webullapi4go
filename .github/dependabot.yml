# Dependency updates for webullapi4go.
#
# gomod keeps third-party dependencies current in the root and nested modules;
# github-actions keeps CI actions current. Both run weekly and open pull requests
# automatically.

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gomod"
  - package-ecosystem: "gomod"
    directory: "/broker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gomod"
  - package-ecosystem: "gomod"
    directory: "/examples/watchlist-cmd"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gomod"
  - package-ecosystem: "gomod"
    directory: "/examples/broker-probe"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gomod"
  - package-ecosystem: "gomod"
    directory: "/examples/futures-probe"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gomod"
  - package-ecosystem: "gomod"
    directory: "/examples/options-multi-leg"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gomod"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
