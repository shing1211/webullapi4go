name: CI

# Public Go SDK module: github.com/shing1211/webullapi4go (Apache-2.0).
#
# The build job tests the Go 1.26 baseline from go.mod and the current stable
# release. Other jobs use go.mod as their single source of truth.
#
# upload-artifact v6+ and golangci-lint-action v9 run on Node.js 24 and require a
# runner of v2.327.1 or newer. Every job here uses a GitHub-hosted runner, so
# that floor is satisfied; a self-hosted runner must be updated before these
# versions will start.

on:
  push:
    branches: [main]
    # A tag push produced no run until this was added, so a release could land
    # on a commit nothing had ever built: v2.1.20 was tagged while its branch
    # push was rejected, leaving the tag on a commit that was on no branch. The
    # v prefix keeps a stray ref from triggering the 26-job matrix.
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege: every job only reads the repository.
permissions:
  contents: read

# Cancel superseded runs for the same branch/PR instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, vet, and test across operating systems and Go versions.
  build:
    name: build, vet, test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.26.x", stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare writable temp dir (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $gotmpdir = Join-Path $env:GITHUB_WORKSPACE ".gotmp"
          New-Item -ItemType Directory -Path $gotmpdir -Force | Out-Null
          "GOTMPDIR=$gotmpdir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

  nested-modules:
    name: ${{ matrix.module }} (build, vet, test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - broker
          - examples/watchlist-cmd
          - examples/broker-probe
          - examples/futures-probe
          - examples/options-multi-leg
          - examples/live-probe
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          check-latest: true
          cache: true

      - name: Build
        run: go build -mod=readonly ./...

      - name: Vet
        run: go vet -mod=readonly ./...

      - name: Test (race detector)
        run: go test -mod=readonly -race -count=1 ./...

  # Lint: formatting and static analysis. Runs on ubuntu-latest (grep-based
  # gofmt check); formatting is OS-independent.
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      # Every module is linted, not just the root. golangci-lint resolves ./...
      # through the module it is invoked in, so a single run at the repository root
      # cannot see broker/ or any of the examples. gofmt below is a plain directory
      # walk and does reach them, which is exactly why the asymmetry was invisible: a
      # dead three-line method sat in broker/client.go from 2026-09-21 until a local
      # run found it, because nothing in CI had ever examined that file.
      #
      # The list mirrors MODULES in the Makefile, which stays the source of truth
      # for the module-aware local gates.
      fail-fast: false
      matrix:
        module:
          - .
          - broker
          - examples/watchlist-cmd
          - examples/broker-probe
          - examples/futures-probe
          - examples/options-multi-leg
          - examples/live-probe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from this module's go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          check-latest: true
          cache: true

      - name: gofmt check
        # Once, from the root, because gofmt is not module-aware and already walks
        # every nested module; running it six times would be the same check six
        # times over. Generated protobuf code under gen/ is excluded (see
        # .golangci.yml); everything else must be gofmt-clean.
        if: matrix.module == '.'
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v '^gen/' || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run golangci-lint
        # working-directory is what makes this per-module: the linter reads its
        # config from there, so each nested module is held to the same
        # .golangci.yml the root uses rather than to golangci-lint's defaults.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          working-directory: ${{ matrix.module }}

  # Coverage: measure and report per-package coverage for the baseline gate.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Test with coverage
        run: go test ./... -cover -coverprofile=coverage.out

      - name: Report coverage
        run: go tool cover -func=coverage.out

      - name: Enforce coverage baseline
        run: |
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v total="$TOTAL" 'BEGIN { if (total + 0 < 60.0) { printf "coverage %.1f%% is below the 60.0%% baseline\n", total; exit 1 } }'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # Nested coverage: measure every nested module and gate only the one that has
  # library code to cover. The four example modules are single-file
  # `package main` programs with no test files, so `go test -coverprofile` writes
  # no profile for them at all and their coverage is structurally 0.0%. A
  # threshold there would be meaningless, so they are attempted for visibility but
  # never gated, and a missing profile is not treated as a failure.
  nested-coverage:
    name: nested coverage (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Artifact names may not contain "/", so each module carries an
        # artifact-safe label alongside its path.
        include:
          - module: broker
            artifact: broker
          - module: examples/watchlist-cmd
            artifact: examples-watchlist-cmd
          - module: examples/broker-probe
            artifact: examples-broker-probe
          - module: examples/futures-probe
            artifact: examples-futures-probe
          - module: examples/options-multi-leg
            artifact: examples-options-multi-leg
          - module: examples/live-probe
            artifact: examples-live-probe
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from module go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          check-latest: true
          cache: true

      - name: Test with coverage
        run: go test -mod=readonly ./... -cover -coverprofile=coverage.out

      # Skipped when the module has no test files and therefore produced no
      # profile; `go tool cover` would otherwise fail on the missing file.
      - name: Report coverage
        if: hashFiles(format('{0}/coverage.out', matrix.module)) != ''
        run: go tool cover -func=coverage.out

      # Only broker is gated. Its measured coverage is 80.8% on 2026-09-26, and the
      # 75.0% floor leaves headroom so ordinary churn does not break the build
      # while a real regression still does.
      - name: Enforce broker coverage floor
        if: matrix.module == 'broker'
        run: |
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v total="$TOTAL" 'BEGIN { if (total + 0 < 75.0) { printf "broker coverage %.1f%% is below the 75.0%% floor\n", total; exit 1 } }'

      - name: Upload nested coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.artifact }}
          path: ${{ matrix.module }}/coverage.out
          # A module with no test files produces no profile, so an absent file is
          # expected rather than an error.
          if-no-files-found: ignore

  # Strict docs gate: build the MkDocs site on every push and pull request.
  # The Docs workflow already builds the site on push to main, but it is a deploy
  # job rather than a gate and does not run on pull requests, so a broken link or
  # nav entry could only be discovered after merge. This job fails the build
  # instead. docs/runs/** is excluded from the site, so internal run artifacts
  # cannot break this gate.
  docs:
    name: docs (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site (strict)
        run: mkdocs build --strict

  # govulncheck: scan every Go module for known vulnerabilities.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - broker
          - examples/watchlist-cmd
          - examples/broker-probe
          - examples/futures-probe
          - examples/options-multi-leg
          - examples/live-probe
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from module go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          check-latest: true
          cache: true

      - name: Run govulncheck
        # Pinned so scan results are reproducible across runs. The vulnerability
        # database is still fetched live from vuln.go.dev, so pinning the tool
        # does not freeze or stale the reported findings.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Citation gate: validate the file:line citations in the status documents.
  # AGENTS.md requires live-blocked defects to be recorded with file:line
  # citations, and those citations have gone stale across several releases with
  # nothing mechanical checking them. The checker is Python 3 standard library
  # only, so this job needs no pip install, no virtualenv, and no secret, and
  # the pip cache the docs job enables is deliberately absent. It runs the
  # checker directly rather than through `make citations`, matching every other
  # job here: the build, coverage, docs, and govulncheck jobs all invoke their
  # tool directly too, so this workflow depends on no local toolchain beyond the
  # tool it runs. A non-zero exit fails the job, and nothing is piped away.
  citations:
    name: citations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check citations
        run: python tools/citations/check.py

  # Release-record gate: every tagged release from v2.1.10 onward must carry a
  # CHANGELOG entry, a docs/runs/index.md row, and be named by both status-document
  # headers. The record fell behind three releases running and nothing else in this
  # workflow could see it, which is why it is here.
  #
  # Full history on purpose, and that is the whole point of the job. The gate
  # compares the tag set against the documents, and checkout's default fetch-depth
  # of 1 yields a tag set that is necessarily partial: the first tag-triggered run
  # fetched only the tag it was building, the gate saw one non-empty tag list, and
  # failed six build jobs over a clone that could not answer the question. The gate
  # now skips a shallow clone with that reason rather than guessing, and this job
  # gives it a clone that can answer.
  release-records:
    name: release records
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, for the tag set)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go (version from module go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Check the release record
        run: go test . -run TestReleaseRecord -v -count=1
