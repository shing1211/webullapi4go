name: CI

# Public Go SDK module: github.com/shing1211/webullapi4go (Apache-2.0).
#
# The build job tests the Go 1.26 baseline from go.mod and the current stable
# release. Other jobs use go.mod as their single source of truth.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job only reads the repository.
permissions:
  contents: read

# Cancel superseded runs for the same branch/PR instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, vet, and test across operating systems and Go versions.
  build:
    name: build, vet, test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.26.x", stable]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare writable temp dir (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $gotmpdir = Join-Path $env:GITHUB_WORKSPACE ".gotmp"
          New-Item -ItemType Directory -Path $gotmpdir -Force | Out-Null
          "GOTMPDIR=$gotmpdir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

  nested-modules:
    name: ${{ matrix.module }} (build, vet, test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - broker
          - examples/watchlist-cmd
          - examples/broker-probe
          - examples/futures-probe
          - examples/options-multi-leg
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          check-latest: true
          cache: true

      - name: Build
        run: go build -mod=readonly ./...

      - name: Vet
        run: go vet -mod=readonly ./...

      - name: Test (race detector)
        run: go test -mod=readonly -race -count=1 ./...

  # Lint: formatting and static analysis. Runs on ubuntu-latest (grep-based
  # gofmt check); formatting is OS-independent.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: gofmt check
        # Generated protobuf code under gen/ is excluded (see .golangci.yml);
        # everything else must be gofmt-clean.
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v '^gen/' || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.9

  # Coverage: measure and report per-package coverage for the baseline gate.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Test with coverage
        run: go test ./... -cover -coverprofile=coverage.out

      - name: Report coverage
        run: go tool cover -func=coverage.out

      - name: Enforce coverage baseline
        run: |
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v total="$TOTAL" 'BEGIN { if (total + 0 < 60.0) { printf "coverage %.1f%% is below the 60.0%% baseline\n", total; exit 1 } }'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # govulncheck: scan dependencies for known vulnerabilities.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
