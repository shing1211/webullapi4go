name: CI

# Public Go SDK module: github.com/shing1211/webullapi4go (Apache-2.0).
#
# The Go toolchain version is NOT hard-coded here: actions/setup-go reads it
# from the `go` directive in go.mod via `go-version-file`, so go.mod remains
# the single source of truth (currently `go 1.26`).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job only reads the repository.
permissions:
  contents: read

# Cancel superseded runs for the same branch/PR instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build, vet, and test across operating systems.
  build:
    name: build, vet, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # On Windows, the test binary can trigger a file-lock on a.out.exe;
      # point Go at a writable temp directory (see AGENTS.md).
      GOTMPDIR: ${{ github.workspace }}/.gotmp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare writable temp dir (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          New-Item -ItemType Directory -Path $env:GOTMPDIR -Force | Out-Null

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test -race -count=1 ./...

  # Lint: formatting and static analysis. Runs on ubuntu-latest (grep-based
  # gofmt check); formatting is OS-independent.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: gofmt check
        # Generated protobuf code under gen/ is excluded (see .golangci.yml);
        # everything else must be gofmt-clean.
        run: |
          UNFORMATTED=$(gofmt -l . | grep -v '^gen/' || true)
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9

  # Coverage: measure and report per-package coverage for the baseline gate.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Test with coverage
        run: go test ./... -cover -coverprofile=coverage.out

      - name: Report coverage
        run: go tool cover -func=coverage.out

      # Artifact is retained for the baseline; a coverage gate (85% on touched
      # code) can be added once the baseline is established.
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # govulncheck: scan dependencies for known vulnerabilities.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go (version from go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
