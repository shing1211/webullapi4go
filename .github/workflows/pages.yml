name: Docs

# Build the MkDocs Material site and publish it to GitHub Pages.
#
# One-time repository setup (manual): Settings -> Pages -> Build and
# deployment -> Source -> "GitHub Actions". Without this the deploy job
# has no Pages environment to target.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the build job; the deploy job needs pages + id-token.
permissions:
  contents: read

# Never let two Pages deployments race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
