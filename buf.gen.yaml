version: v2
plugins:
  # Codegen requires protoc-gen-go and protoc-gen-go-grpc on PATH:
  #   go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
  #   go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
  #
  # The vendored events.proto carries no option go_package (it is kept
  # byte-identical to upstream), so the Go import path and package name are
  # supplied here via an `M` mapping instead.
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
      - Mwebull/trade/events/v1/events.proto=github.com/shing1211/webullapi4go/gen/webull/trade/events/v1;eventsevents
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
      - Mwebull/trade/events/v1/events.proto=github.com/shing1211/webullapi4go/gen/webull/trade/events/v1;eventsevents
