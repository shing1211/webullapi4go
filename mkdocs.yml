# MkDocs configuration for the webullapi4go documentation site.
#
# The site is built from docs/ and published to GitHub Pages by
# .github/workflows/pages.yml. Only public documentation belongs here;
# internal run artifacts under docs/runs/ are excluded below.

site_name: webullapi4go
site_description: Idiomatic Go SDK for the Webull OpenAPI.
site_url: https://shing1211.github.io/webullapi4go/
repo_url: https://github.com/shing1211/webullapi4go
repo_name: shing1211/webullapi4go
copyright: Copyright &copy; webullapi4go contributors &mdash; Apache-2.0

docs_dir: docs

# Internal run artifacts (docs/runs/**) are workspace-only and must never be
# published. `exclude_docs` requires MkDocs >= 1.5.
exclude_docs: |
  runs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  # Layer 1 — hand-written SDK guides.
  - Guides:
      - Authentication: authentication.md
      - Market Data: market-data.md
      - Fundamentals: fundamentals.md
      - Streaming: streaming.md
      - Trading: trading.md
      - Trading Events: events.md
      - Broker API HK: broker-hk.md
      - Broker FD US: broker-fd-us.md
      - Sandbox: sandbox.md
      - Errors: errors.md
      - Patterns: patterns.md
      - Troubleshooting: troubleshooting.md
  # Layer 2 — generated: each official endpoint mapped to its SDK method.
  - API Reference:
      - Overview: webull-api.md
      - Go Packages: api.md
      - Authentication: webull-api/authentication.md
      - Market Data — Stock: webull-api/market-data-stock.md
      - Market Data — Option: webull-api/market-data-option.md
      - Market Data — Crypto: webull-api/market-data-crypto.md
      - Market Data — Futures: webull-api/market-data-futures.md
      - Market Data — News: webull-api/market-data-news.md
      - Market Data — Screener: webull-api/market-data-screener.md
      - Market Data — Watchlist: webull-api/market-data-watchlist.md
      - Fundamentals and Fund Data: webull-api/fundamentals.md
      - Event Contracts: webull-api/event-contracts.md
      - Trading API: webull-api/trading.md
      - Broker API — HK: webull-api/broker-hk.md
      - Broker API — FD (US): webull-api/broker-fd-us.md
      - Display Solution: webull-api/display-solution.md
      - Streaming (MQTT): webull-api/streaming.md
      - Events (gRPC): webull-api/events.md
      - Connect API (OAuth): webull-api/connect-api.md
  # Layer 3 — generated verbatim snapshots of Webull's own documentation.
  - Official Webull Docs:
      - Guides: webull-api/master-guides.md
      - Endpoints: webull-api/master-reference.md
      - Reference:
          - Authentication: webull-api/reference/authentication.md
          - Market Data — Stock: webull-api/reference/market-data-stock.md
          - Market Data — Option: webull-api/reference/market-data-option.md
          - Market Data — Crypto: webull-api/reference/market-data-crypto.md
          - Market Data — Futures: webull-api/reference/market-data-futures.md
          - Market Data — News: webull-api/reference/market-data-news.md
          - Market Data — Screener: webull-api/reference/market-data-screener.md
          - Market Data — Watchlist: webull-api/reference/market-data-watchlist.md
          - Fundamentals and Fund Data: webull-api/reference/fundamentals.md
          - Event Contracts: webull-api/reference/event-contracts.md
          - Trading API: webull-api/reference/trading.md
          - Broker API — HK: webull-api/reference/broker-hk.md
          - Broker API — FD (US): webull-api/reference/broker-fd-us.md
          - Display Solution: webull-api/reference/display-solution.md
          - Streaming (MQTT): webull-api/reference/streaming.md
          - Events (gRPC): webull-api/reference/events.md
          - Connect API (OAuth): webull-api/reference/connect-api.md
  - Coverage:
      - SDK ↔ API Reconciliation: reconciliation.md
  - Architecture Decisions:
      - Overview: adr/index.md
      - "0001: Record architecture decisions": adr/0001-record-architecture-decisions.md
      - "0002: gRPC event protobuf strategy": adr/0002-grpc-event-protobuf-strategy.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

plugins:
  - search
  # Preserve published URLs across page renames (broker, brokerfd, crypto).
  - redirects:
      redirect_maps:
        broker.md: broker-hk.md
        brokerfd.md: broker-fd-us.md
        webull-api/crypto.md: webull-api/market-data-crypto.md
        webull-api/reference/crypto.md: webull-api/reference/market-data-crypto.md
